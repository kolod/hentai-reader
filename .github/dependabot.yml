version: 2

updates:
  # Root npm workspace (contract, tools/runner) — one lockfile at the root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Windows host: projects referenced by windows/HentaiReader.slnx.
  - package-ecosystem: "nuget"
    directory: "/windows"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      prefix: "chore(deps)"
    groups:
      # WindowsAppSDK and its explicitly pinned component packages must move together.
      windows-app-sdk:
        patterns:
          - "Microsoft.WindowsAppSDK*"
          - "Microsoft.Windows.AI.MachineLearning"
          - "Microsoft.Windows.SDK.BuildTools"
      test:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  # .NET SDK pinned in global.json.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
