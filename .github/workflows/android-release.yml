# Android release (007 T085): on a tag android-vX.Y.Z, test, build the signed release APK and
# attach it with its SHA-256 to the GitHub Release of that tag.
#
# Repository secrets:
#   HR_KEYSTORE_BASE64    the release keystore, base64-encoded
#   HR_KEYSTORE_PASSWORD  its password
#   HR_KEY_ALIAS          the key alias
#   HR_KEY_PASSWORD       the key password
# The keystore is decoded into the runner's temp folder for this job only; it is never cached or
# uploaded.
name: android-release

on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Tag matches versionName
        working-directory: android
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          declared="$(grep -E '^versionName=' gradle.properties | cut -d= -f2)"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName=$declared in android/gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Shared strings are generated from the Windows .resw files
        run: npm run l10n:android -- --check

      - name: Decode the keystore
        env:
          HR_KEYSTORE_BASE64: ${{ secrets.HR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HR_KEYSTORE_BASE64" ]; then echo "::error::secret HR_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$HR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests and signed release build
        working-directory: android
        env:
          HR_KEYSTORE_PASSWORD: ${{ secrets.HR_KEYSTORE_PASSWORD }}
          HR_KEY_ALIAS: ${{ secrets.HR_KEY_ALIAS }}
          HR_KEY_PASSWORD: ${{ secrets.HR_KEY_PASSWORD }}
        run: ./gradlew :host:test :app:lintRelease :app:assembleRelease --console=plain

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature and size, compute SHA-256
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "::error::no signed APK (is the signing configuration complete?)"; exit 1; fi
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | head -3
          size=$(stat -c %s "$apk")
          echo "APK size: $size bytes"
          # SC-012: the APK stays below 40 MB.
          if [ "$size" -ge $((40 * 1024 * 1024)) ]; then echo "::error::APK is $size bytes, limit 40 MB"; exit 1; fi
          mkdir -p dist
          cp "$apk" "dist/hentai-reader-android-$VERSION.apk"
          (cd dist && sha256sum "hentai-reader-android-$VERSION.apk" > "hentai-reader-android-$VERSION.apk.sha256")
          cat dist/*.sha256

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' android/CHANGELOG.md)"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Hentai Reader for Android $VERSION" --notes "${notes:-See android/CHANGELOG.md}"
          fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-reports
          path: |
            android/host/build/reports/tests/
            android/app/build/reports/
          if-no-files-found: ignore
