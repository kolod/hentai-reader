# Keeps main green (Constitution X): contract, runner and every source script are checked and
# tested offline on each push and pull request; the Windows host must replay the same recordings
# with identical results (003 parity suite). No network access is needed.
# Each job runs only when a path it builds from changed; a manual run checks everything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR supersedes its running check; every main commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sources: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.sources == 'true' }}
      windows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.windows == 'true' }}
      installer: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.installer == 'true' }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # The Windows host embeds contract/ and bundles sources/, so both rebuild it too.
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            shared: &shared
              - contract/**
              - sources/**
            node: &node
              - tools/**
              - package.json
              - package-lock.json
            dotnet: &dotnet
              - windows/**
              - global.json
            sources:
              - *ci
              - *shared
              - *node
            windows:
              - *ci
              - *shared
              - *dotnet
            installer:
              - *ci
              - *shared
              - *node
              - *dotnet
            # The Android host packs contract/ and sources/ and generates its shared strings
            # from the Windows .resw files.
            android:
              - *ci
              - *shared
              - android/**
              - windows/src/HentaiReader.App/Strings/**
              - tools/l10n/**
              - package.json
              - package-lock.json

  sources:
    needs: changes
    if: needs.changes.outputs.sources == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run schema
      - name: Runner unit tests
        run: node --test "tools/runner/test/*.test.ts"
      - name: Host contract suite
        run: npm run runner -- contract-test
      - name: Conformance reference sources
        run: |
          for dir in contract/conformance/minimal contract/conformance/settings; do
            npm run runner -- check "$dir"
            npm run runner -- test "$dir"
          done
      - name: Source scripts (check + offline tests)
        run: |
          for dir in sources/*/; do
            [ -f "$dir$(basename "$dir").js" ] || continue
            echo "::group::$dir"
            npm run runner -- check "$dir"
            npm run runner -- test "$dir"
            echo "::endgroup::"
          done

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Build (host, tests, WinUI app)
        run: dotnet build windows/HentaiReader.slnx -c Release -p:Platform=x64
      - name: Host unit tests and parity suite
        run: dotnet test --project windows/tests/HentaiReader.Host.Tests -c Release

  # The whole Windows distribution (004): tests, publish, content verification, installer,
  # portable ZIP and a real silent install / upgrade / downgrade / uninstall on the runner.
  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build, verify and smoke-test the installer
        run: pwsh windows/build/Build-Installer.ps1 -BootstrapTools -SmokeTest
      - name: Upload installer, portable ZIP and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hentai-reader-windows
          path: artifacts/installer/
          if-no-files-found: warn

  # Android (007): the parity suite runs on the JVM against the desktop build of the APK's
  # QuickJS (specs/007-android-app/contracts/parity-suite-android.md), then the app is built.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Shared strings are generated from the Windows .resw files
        run: npm run l10n:android -- --check
      - name: Host unit tests and parity suite, app build and lint
        working-directory: android
        run: ./gradlew :host:test :app:lintDebug :app:assembleDebug --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            android/host/build/reports/tests/
            android/app/build/reports/
          if-no-files-found: ignore
